# 公开版本码的唯一真源。
#
# 规则：任何一次对外发版，这里的数字必须严格大于历史上已经发出去的所有 versionCode。
# 禁止从 git 提交数、分支名、tag 或 clone 深度推导——这些都随时会变，历史上已经因为
# 这个思路出过两次事故：
#
#   1) 为了给 debug 变体留一个 +1，把公开码整体乘十 → 用户看到 312770 这种六位数；
#      同时内核报 31277、管理器报 312770，首页的「LKM 可更新」提示永远清不掉。
#   2) 改成「31000 + 提交数」后，从另一个功能分支(346 个提交) 切回 fresh-main
#      (279 个提交) → 31346 直接倒退成 31279，已经装了 31346 的用户永远收不到更新，
#      因为管理器比较 versionCode 时判定「已是最新」。
#
# 读它的地方（三处必须永远一致，改这里就不用动它们）：
#   - manager/build.gradle.kts        → getBaseVersionCode() / APK versionCode
#   - kernel/Kbuild                   → KSU_VERSION（内核上报的那个号）
#   - .github/workflows/build-xecpro.yml → release tag 里的 v<码>-<短哈希>
# 护栏：scripts/check_version_monotonic.py（CI guards job）会拿它和仓库里所有
# v<码>-* 标签比，一旦不大于历史最大值就直接失败。
versionCode=31384
