<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="XECKernelPro Liquid Home">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071112"/>
      <stop offset="0.55" stop-color="#0b1a19"/>
      <stop offset="1" stop-color="#101d2b"/>
    </linearGradient>
    <radialGradient id="aqua" cx="0.12" cy="0.18" r="0.8">
      <stop offset="0" stop-color="#12b886" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#12b886" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="0.92" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
