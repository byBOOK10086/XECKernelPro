name: Build XECKernelPro

# 品牌化专用构建流水线。
# 使用方式:
#   1. 把本仓库推送到你自己的 GitHub 仓库
#   2. Actions -> Build XECKernelPro -> Run workflow
#   3. 跑完后在 "Artifacts" 里下载打好的 XECkernelPro 管理器 APK
# 签名密钥不入库：使用仓库 Secrets（SIGN_KEYSTORE_B64 / SIGN_STORE_PASS /
# SIGN_KEY_PASS），密钥内容与原仓库内 xecpro-key.jks 完全相同，签名结果不变。

on:
  workflow_dispatch:
    inputs:
      publish:
        # 默认 false：手动跑一次只是**出构建产物**（内测 APK），不会创建 Release、不动版本号。
        # 要发版必须在手动 dispatch 时显式勾上——本工作流**刻意不监听 push: tags**
        # （原因见下面的 on: 注释），所以"推 v* 标签发版"在这条流水线上不存在。
        # 这条闸门是 2026-10-15 加的：之前手动 dispatch 一定会走到 release job，
        # 内测构建得靠"盯着 run 手动取消"，一次没取消干净就会把没确认的版本发出去。
        description: '创建 GitHub Release（发版）。只出内测包请保持关闭'
        type: boolean
        default: false
      semver:
        # 语义化版本（SemVer）：v主.次.修订[-alpha.N|-beta.N|-rc.N]。
        # MAJOR=不向后兼容的 API/行为变更；MINOR=向后兼容的新功能；PATCH=向后兼容的修复。
        # 含 alpha/beta/rc 预发布段的 tag 自动标记 GitHub Pre-Release；干净版本=正式 Release。
        # 内部 versionCode（仓库根 version.properties，唯一真源）与 APK 文件名尾部的
        # <versionCode> 不受影响——那仍是管理器"检查更新"的版本比较依据，SemVer 只作用于
        # tag 与发布通道。
        description: 'SemVer 版本号（发版用，如 2.0.0 / 2.1.0-rc.1）。留空=沿用 v<版本号>-<短哈希>'
        type: string
        required: false
        default: ''
      draft:
        # 只有在 publish=true（会创建 Release）时才有意义。
        # true（默认）= 建草稿：资产齐全、可以下载来测，但局外人、公开 API、检查更新
        # 和官网全都看不到，直到有人在 Releases 页面手动点发布。
        # 关掉它才叫"推给用户"，那一步必须是有意识的操作。
        description: 'Release 建成草稿（不公开给用户）'
        type: boolean
        default: true
  # 刻意不再监听 `push: tags`。发布 Release 本身就会创建 `v<码>-<短哈希>` 标签，而那次
  # 推送会把整条流水线（18 个 job、约 40 分钟）再跑一遍：产物与刚构建的完全重复，而且
  # tag 触发时 `publish`/`draft` 两个输入是空的（draft 回落成默认 true），理论上足以把
  # 刚发布的 Release 打回草稿。发版统一走 workflow_dispatch。
  #
  # 2026-11-05 实测过一次：发布 v31347 后触发的重跑里，guards 因为"当前版本号 == 刚切出
  # 的 tag 号"判成没有前进而变红（护栏已同步改成排除指向 HEAD 的 tag）。

permissions:
  contents: read

env:
  SIGN_KEY_ALIAS: xecpro-key
  BRAND_PACKAGE: com.xecpro.kernel
  BRAND_NAME: XECKernelPro

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 版本号护栏要拿 version.properties 跟仓库里所有 v<码>-* 标签比对，
          # 浅克隆只有 1 个提交、也没有 tag，护栏会静默失效。
          fetch-depth: 0
          fetch-tags: true

      # 公开版本码只许前进。它曾经从提交数推导：从另一个功能分支(346 提交) 切到
      # 本分支(279 提交) 时，31346 倒退成 31279，装了 31346 的用户永远收不到更新。
      - name: Public version code moves forward only
        run: python3 scripts/check_version_monotonic.py

      # Reverse guard: the KernelPatch module-loading plane was removed on
      # 2026-11-04. This fails the build if any of it (or its payloads) comes
      # back. It is a separate cheap job so it reports before the heavy matrix.
      - name: No residual loader references
        run: python3 scripts/check_no_kpm.py

      # The three supercall.h mirrors are hand-synced; drift in the loader era shipped an
      # ioctl the kernel no longer had. Assert they stay byte-identical.
      - name: UAPI mirrors identical
        run: python3 scripts/check_uapi_mirror.py

      # 包名是被"烘进产物"的身份，不是注释：ksud 的 KSU_PACKAGE_NAME 决定它在设备上
      # 认哪个包是管理器。这条链曾经整条写着上游的 me.weishu.kernelsu —— 构建 18/18
      # 全绿、设备上 su_daemon 的 is_manager_uid() 却永远返回 false（挂载态首授权
      # bootstrap 因此从不触发），boot_patch 的 /data/user_de/<pkg>/ 备份目录也建不出来。
      # 真源固定在 manager/app/build.gradle.kts 的 applicationId。
      - name: App package identity agrees everywhere
        run: python3 scripts/check_package_identity.py

      # 内置 GhostLock 的 profile 选择完全靠 index.conf：列了却没有文件 → 那台设备
      # 运行时才炸（而它恰好是最需要这条路的那台）；有文件却没列 → 永远选不到，白占
      # APK。两类错误都在这条闸门上，HOCON include 片段与 resolver 预置文件不算漏列。
      - name: Ghostlock kernel profile index agrees with the assets
        run: python3 scripts/check_ghostlock_profiles.py

      # 许可证矩阵：根 LICENSE=AGPL-3.0（我们的代码）/ LICENSE-GPL-3.0（KernelSU 派生文件）/
      # kernel/LICENSE=GPL-2.0。三份正文、矩阵文件、两个 README 的口径必须一致，否则二次分发者
      # 拿到的条款与实际不符；同时断言仓库里没有混进自定义许可的 Oh My Keymint。
      - name: Licence matrix is self-consistent
        run: python3 scripts/check_license_matrix.py

      # 服务器端代码对外开源（AGPL §13），它同时也是任何人都能读的：断言 server/
      # 里没有明文口令/令牌/本机绝对路径，且 .env.example 的占位符保持为空。
      - name: Server code carries no credentials
        run: python3 scripts/check_server_secrets.py

      # GitHub 对坏掉的 workflow 是静默拒绝：run 照样建出来，但 jobs 为空、没有一行
      # shell 报错，看上去和普通变红没区别，所以没人会去点开。GKI 流水线就是这样从
      # 2026-10-31 死到 11-06 —— 一个反斜杠被写成了真换行。
      - name: Workflow files still parse into runnable jobs
        run: |
          python3 -c "import yaml" 2>/dev/null || pip3 install --quiet --disable-pip-version-check pyyaml
          python3 scripts/check_workflows.py

  generate-key:
    runs-on: ubuntu-latest
    steps:
      - name: Verify signing secrets present
        env:
          SIGN_KEYSTORE_B64: ${{ secrets.SIGN_KEYSTORE_B64 }}
          SIGN_STORE_PASS: ${{ secrets.SIGN_STORE_PASS }}
          SIGN_KEY_PASS: ${{ secrets.SIGN_KEY_PASS }}
        run: |
          # 注意：secret 不能经 job outputs 传给下游（Actions 会 Skip output
          # since it may contain secret），每个 job 必须直读 secrets.*。
          # 本 job 只做早期哨兵校验，真正的解码在各自消费步骤完成。
          [ -n "$SIGN_KEYSTORE_B64" ] || { echo "::error::secret SIGN_KEYSTORE_B64 not set"; exit 1; }
          [ -n "$SIGN_STORE_PASS" ] || { echo "::error::secret SIGN_STORE_PASS not set"; exit 1; }
          [ -n "$SIGN_KEY_PASS" ] || { echo "::error::secret SIGN_KEY_PASS not set"; exit 1; }
          echo "signing secrets present"

  build-lkm:
    needs: [guards, generate-key]
    uses: ./.github/workflows/build-lkm.yml
    with:
      # Upstream replaced the expected_size2/expected_hash2 inputs with the
      # KSU_IS_PR_BUILD mechanism, so the call must use the current contract or
      # Actions fails the run at startup ("not defined in the referenced
      # workflow"). kernel/Kbuild already defaults EXPECTED_SIZE/HASH to our
      # release key, and the package name is pinned here explicitly.
      package_name: com.xecpro.kernel
    secrets: inherit

  build-ksuinit:
    needs: [guards]
    uses: ./.github/workflows/ksuinit.yml

  build-xecinit:
    needs: [guards]
    uses: ./.github/workflows/xecinit.yml

  # SUSFS 的可加载内核模块（third_party/susfs4ksu-lkm）。LKM 形态设备本来没有
  # SUSFS —— 它只随自编译 GKI 内核提供——这个 job 把那份能力补进我们的发布链。
  # 只编 aarch64，且必须和 kernelsu.ko 用同一份 DDK 头，否则内核拒绝加载。
  build-susfs-lkm:
    needs: [guards]
    uses: ./.github/workflows/build-susfs-lkm.yml

  build-ksud:
    needs: [build-lkm, build-ksuinit, build-xecinit, build-susfs-lkm]
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
          - target: x86_64-linux-android
    uses: ./.github/workflows/ksud.yml
    with:
      target: ${{ matrix.target }}
      pack_lkm: true
      pack_ksuinit: true
      pack_xecinit: true
      pack_susfs: true

  build-manager:
    needs: [guards, generate-key]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write brand keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SIGN_STORE_PASS }}
          KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASS }}
          KEYSTORE_B64: ${{ secrets.SIGN_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > xecpro-key.jks
          {
            echo KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            echo KEY_ALIAS='xecpro-key'
            echo KEY_PASSWORD="$KEY_PASSWORD"
            echo KEYSTORE_FILE='xecpro-key.jks'
          } >> gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 同 ksud.yml 的理由：runner 到 repo.maven.apache.org / github.com 取
      # kotlin-compiler-embeddable 会 504。只追加 Central 的镜像源，不改坐标。
      - name: Point Gradle at Maven mirrors
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/ci-mirrors.gradle <<'EOF'
          def mirrors = [
              'https://maven.aliyun.com/repository/public',
              'https://repo1.maven.org/maven2',
          ]

          // 只能**追加**，绝不能替换项目自己声明的仓库。
          // RepositoriesMode 默认 PREFER_PROJECT：一旦给某个 project 塞了 project 级
          // 仓库、而它自己一个都没声明（manager 的 app 正是如此，仓库全写在下边
          // settings 的 dependencyResolutionManagement 里），settings 里的 google()/
          // mavenCentral()/jitpack 就会被整体忽略，androidx 全线变成
          // "Could not find"（2026-11-09 真炸过一次，整轮构建红掉）。
          settingsEvaluated { settings ->
              try {
                  mirrors.each { u ->
                      settings.dependencyResolutionManagement.repositories.maven { url u }
                  }
              } catch (Throwable ignored) { }
              try {
                  mirrors.each { u ->
                      settings.pluginManagement.repositories.maven { url u }
                  }
              } catch (Throwable ignored) { }
          }

          allprojects { project ->
              // buildscript 类路径照样追加（Kotlin 编译器那个 jar 走这条），安全。
              project.buildscript.repositories {
                  mirrors.each { u -> maven { url u } }
              }
              // 只有当项目**自己**声明过仓库时才追加，避免把 PREFER_PROJECT 翻过来。
              project.afterEvaluate {
                  if (!project.repositories.isEmpty()) {
                      project.repositories {
                          mirrors.each { u -> maven { url u } }
                      }
                  }
              }
          }
          EOF
          echo "wrote ~/.gradle/init.d/ci-mirrors.gradle"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -uo pipefail

          # 不用 android-actions/setup-android：它会无条件执行 `sdkmanager tools`，
          # 而 Google 已下架 tools 包，导致该 action 必然以 exit 1 收尾并中断 job。
          # 这里直接复用 runner 镜像自带的 Android SDK + cmdline-tools。
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "${SDK_ROOT}" ] || [ ! -d "${SDK_ROOT}" ]; then
            SDK_ROOT=""
            for d in /usr/local/lib/android/sdk /opt/android-sdk /opt/android "$HOME/Android/Sdk" "$HOME/android-sdk"; do
              if [ -d "$d" ]; then SDK_ROOT="$d"; break; fi
            done
          fi
          if [ -z "${SDK_ROOT}" ]; then
            echo "::error::no Android SDK found on this runner"
            ls -la /usr/local/lib/android 2>/dev/null || true
            exit 1
          fi
          echo "Android SDK root: ${SDK_ROOT}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"

          SDKMGR="$(find "${SDK_ROOT}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "${SDKMGR}" ]; then
            echo "::error::sdkmanager not found under ${SDK_ROOT}/cmdline-tools"
            find /usr/local /opt "$HOME" -maxdepth 5 -type f -name sdkmanager 2>/dev/null | head -n 20 || true
            exit 1
          fi
          echo "sdkmanager: ${SDKMGR}"
          echo "$(dirname "${SDKMGR}")" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"

          # 先接受全部 license，保证 sdkmanager 与 AGP 的自动下载都不会被卡住。
          yes | "${SDKMGR}" --sdk_root="${SDK_ROOT}" --licenses > /dev/null 2>&1 || true

          # 逐包安装：个别包名即使不存在，也不会中断其余包。
          for pkg in "platform-tools" "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865"; do
            echo "--- installing ${pkg}"
            "${SDKMGR}" --sdk_root="${SDK_ROOT}" --install "${pkg}" \
              || echo "::warning::sdkmanager could not install '${pkg}'; Gradle will try to auto-download it"
          done

          ls "${SDK_ROOT}/build-tools" 2>/dev/null || true
          ls "${SDK_ROOT}/platforms" 2>/dev/null || true
          ls "${SDK_ROOT}/ndk" 2>/dev/null || true

      - name: Build GhostLock native payload
        # vendored third_party/ghostlock (see UPSTREAM.md); the PIE binary is
        # shipped as jniLibs/arm64-v8a/libghostlock.so so it can be exec'd
        # straight from nativeLibraryDir (useLegacyPackaging is enabled).
        working-directory: .
        run: |
          set -euo pipefail
          NDK_DIR="$(ls -d "${ANDROID_SDK_ROOT:-${ANDROID_HOME:?}}"/ndk/* 2>/dev/null | sort | tail -n 1)"
          if [ -z "$NDK_DIR" ]; then
            echo "::error::no NDK found under the Android SDK"
            exit 1
          fi
          echo "NDK: ${NDK_DIR}"
          make -C third_party/ghostlock/src NDK_ROOT="$NDK_DIR" -j"$(nproc)"
          "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            --strip-unneeded third_party/ghostlock/build/native/ghostlock
          mkdir -p manager/app/src/main/jniLibs/arm64-v8a
          cp -f third_party/ghostlock/build/native/ghostlock \
            manager/app/src/main/jniLibs/arm64-v8a/libghostlock.so
          file manager/app/src/main/jniLibs/arm64-v8a/libghostlock.so
          ls -la manager/app/src/main/jniLibs/arm64-v8a/

      - name: Restore payload cache
        # 载荷字节固定（每个都带 sha256 校验），命中就跳过 KPatch(≈5min) 与
        # Magisk(≈3min) 的下载 —— 2026-11-09 实测这两步占了 build-manager 一半时间。
        uses: actions/cache@v4
        with:
          path: .cache/payload
          key: xec-payloads-kpatch-0.13.5-2-magisk-30.7-v1

      - name: Fetch KPatch binaries (<5.10 kernel route)
        # 硬上限：这两个文件合计不到 500KB，正常源十几秒就该完成。2026-11-09 两次
        # 构建各在这里/Magisk 那步挂了几十分钟（curl 连着但零字节），所以给步骤本身
        # 加 timeout。**不**加 --speed-limit：runner→自家 OpenList 实测只有 ~2KB/s，
        # 按速度掐会把这条唯一能用的慢线也掐死（2026-11-09 12:30 就这么红过一次）。
        timeout-minutes: 12
        # KernelPatch 路线（5.10 以下内核）：kptools-android 打进 jniLibs
        # （libxecimgtool.so，可从 nativeLibraryDir exec），kpimg 进 assets。
        # 版本与 sha256 固定在 KernelSU-Next/KPatch-Next 0.13.5-2（GPL-2.0）。
        working-directory: .
        run: |
          set -euo pipefail
          BASE="https://github.com/KernelSU-Next/KPatch-Next/releases/download/0.13.5-2"
          VENDOR="http://42.193.123.248:5244/d/vendor"
          # 我们自己的镜像放第一位：2026-11-09 连续四次构建全挂在 runner→github 的
          # 504 上（gradle 发行包、kotlin 编译器、kptools 各中一次），镜像站也一起 504。
          # 这两个二进制合计不到 500KB，直接放在自己的 OpenList 上，CI 只依赖一台
          # 我们自己能管的服务器；github 与公共镜像留作后备。
          # 顺序变了，但**每个源都必须过同一个 sha256** 才算数，一个字节都不放松。
          # 每个镜像都必须拼到**资产文件名**：只写到 /download/<tag> 会拿到发布页 HTML，
          # 体积对不上、sha256 直接失败 —— 2026-11-09 之前的 "github 与镜像全挂"
          # 就是这个原因（vendor 那条带了文件名，所以只有它"能用"，还特别慢）。
          fetch() {
            local name="$1" sha="$2" dest="$3" url
            # 镜像 URL 必须在函数**内部**拼：`${name}` 是这里的本地变量，
            # 放到函数外用 set -u 会直接 "name: unbound variable"（2026-11-09 踩过）。
            local mirrors="${BASE}/${name} https://ghfast.top/${BASE}/${name} https://gh-proxy.com/${BASE}/${name}"
            # 缓存先行：这两个二进制不会变，命中就完全跳过网络（2026-11-09 实测
            # 一次 KPatch 拉取要 5 分钟，自家源只有 ~2KB/s）。
            if [ -f ".cache/payload/${name}" ] && echo "${sha}  .cache/payload/${name}" | sha256sum -c - >/dev/null 2>&1; then
              mkdir -p "$(dirname "${dest}")"
              cp -f ".cache/payload/${name}" "${dest}"
              echo "cached ${name}"
              return 0
            fi
            for url in \
                "${VENDOR}/${name}" \
                ${mirrors}; do
              if curl -fsSL --retry 2 --retry-all-errors --retry-delay 3 \
                   --connect-timeout 20 --max-time 300 \
                   -o "/tmp/${name}" "${url}" 2>/dev/null \
                 && echo "${sha}  /tmp/${name}" | sha256sum -c - >/dev/null 2>&1; then
                mkdir -p "$(dirname "${dest}")"
                cp -f "/tmp/${name}" "${dest}"
                mkdir -p .cache/payload
                cp -f "/tmp/${name}" ".cache/payload/${name}"
                echo "fetched ${name} from ${url}"
                return 0
              fi
              echo "fetch ${name} from ${url} failed; trying next source" >&2
            done
            echo "::error::could not fetch ${name} from any source (vendor, github or mirrors)"
            return 1
          }
          fetch kptools-android aced6809a27e61604934349396de33fc98c91ad8b0b3c10959750e1956a63660 \
            manager/app/src/main/jniLibs/arm64-v8a/libxecimgtool.so
          fetch kpimg-linux 943ce69cb00ed7aaff988da9a3fdda89004ba813b2c30aa4a843c642542d4cde \
            manager/app/src/main/assets/kpatch/kpimg
          chmod +x manager/app/src/main/jniLibs/arm64-v8a/libxecimgtool.so
          file manager/app/src/main/jniLibs/arm64-v8a/libxecimgtool.so
          ls -la manager/app/src/main/assets/kpatch/

      - name: Fetch Magisk payload (<5.10 mount-state route)
        # 只有发版（publish=true）才需要这条 <5.10 挂载态载荷：
        #  * 它的用途是给 5.10 以下设备做 Magisk 路线，和本次要验的 UI 编译无关；
        #  * 2026-11-09 连续三台 runner 都拉不动那个 9MB 资产（自家源 ~5KB/s，
        #    github / 两个加速全挂），debug 构建被它卡住没有意义；
        #  * 发版路径仍然强制要求：下面 *Verify Magisk payload survived repack + sign*
        #    同样按 publish 门控，缺载荷会当场红。
        if: ${{ inputs.publish }}
        # 硬上限：Magisk APK 约 9MB，任一正常源几分钟内都该完成。2026-11-09 这步
        # 卡了 46 分钟零输出（--max-time 600 × --retry 5 = 最长一小时），把整个
        # build-manager 拖死。现在每个 URL 只试一次、单 URL 最多 240s，
        # 整步 13 分钟硬超时：黑洞链接最多花 4 分钟，不会再拖死 job。
        timeout-minutes: 13
        # 方案甲：5.10 以下的挂载态 root 直接用 Magisk 官方的修补方式。
        # 载荷**原样**取自 topjohnwu/Magisk v30.7（GPL-3.0，见 THIRD_PARTY_NOTICES.md），
        # 一个字节都不改；只按 boot_patch.sh 头部写明的目录契约改名落地：
        #   assets/magisk/{boot_patch.sh,util_functions.sh,stub.apk}
        #   jniLibs/<abi>/{libmagiskboot,libmagiskinit,libmagisk,libinit-ld,
        #                  libbusybox,libmagiskpolicy}.so
        # 每个文件都单独校验 sha256（不放心的不止是下载是否完整，也包括中间被替换）。
        working-directory: .
        run: |
          set -euo pipefail
          # 这里**不**用 --retry：9MB 的文件一旦连上黑洞，重试只会把单源耗时翻倍，
          # 时间预算交给下面的步骤级超时；多源轮询本身就是重试。
          # Magisk APK 走自家 OpenList / github / 公共镜像三路，**每个源都必须过
          # 同一个 sha256** 才算数，落地的字节与官方发布件完全一致。
          MAGISK_APK="Magisk-v30.7.apk"
          MAGISK_SHA=e0d32d2123532860f97123d927b1bb86c4e08e6fd8a48bfc6b5bee0afae9ebd5
          MAGISK_BASE="https://github.com/topjohnwu/Magisk/releases/download/v30.7"
          VENDOR="http://42.193.123.248:5244/d/vendor"
          # 顺序：自家 OpenList → github 原站 → 两个公共加速。
          # 2026-11-09 换过两次顺序，两次都踩到不同的一面：
          #  * 自家源排第一时，某台 runner 到腾讯云零字节，--max-time 600×5 拖了 46 分钟；
          #  * github 排第一时，另一台 runner 到 release 资产直接挂住，12 分钟超时。
          # 现在靠"每个 URL 只试一次 + 单 URL 最多 240s + 步骤 13 分钟硬超时"兜底：
          # 任何一条黑洞链接最多花 4 分钟，整步最多 13 分钟，不会再拖死 job。
          # 自家源排第一是因为它这两次实测最快（KPatch 400KB 只用了 13 秒）。
          MIRRORS="${MAGISK_BASE}/${MAGISK_APK} https://ghfast.top/${MAGISK_BASE}/${MAGISK_APK} https://gh-proxy.com/${MAGISK_BASE}/${MAGISK_APK} https://ghproxy.net/${MAGISK_BASE}/${MAGISK_APK} https://github.moeyy.xyz/${MAGISK_BASE}/${MAGISK_APK}"
          magisk_ok=0
          # 缓存命中就直接用，不碰网络。
          if [ -f .cache/payload/magisk.apk ] \
             && echo "${MAGISK_SHA}  .cache/payload/magisk.apk" | sha256sum -c - >/dev/null 2>&1; then
            cp -f .cache/payload/magisk.apk /tmp/magisk.apk
            echo "cached magisk apk"
            magisk_ok=1
          fi
          for url in "${VENDOR}/${MAGISK_APK}" ${MIRRORS}; do
            [ "${magisk_ok}" = 1 ] && break
            if curl -fsSL --connect-timeout 20 --max-time 180 \
                 -o /tmp/magisk.apk "${url}" 2>/dev/null \
               && echo "${MAGISK_SHA}  /tmp/magisk.apk" | sha256sum -c - >/dev/null 2>&1; then
              echo "magisk apk from ${url}"
              magisk_ok=1
              break
            fi
            echo "magisk apk from ${url} failed; trying next source" >&2
          done
          [ "${magisk_ok}" = 1 ] || {
            echo "::error::could not fetch ${MAGISK_APK} from any source (vendor, github or mirrors)"
            exit 1
          }
          mkdir -p .cache/payload
          cp -f /tmp/magisk.apk .cache/payload/magisk.apk
          echo "${MAGISK_SHA}  /tmp/magisk.apk" | sha256sum -c -

          extract() {  # extract <apk-entry> <dest> <sha256>
            local entry="$1" dest="$2" sha="$3"
            mkdir -p "$(dirname "${dest}")"
            unzip -p /tmp/magisk.apk "${entry}" > "${dest}"
            echo "${sha}  ${dest}" | sha256sum -c -
          }

          extract assets/boot_patch.sh manager/app/src/main/assets/magisk/boot_patch.sh \
            20de7208d610a267aaafafe09846c4458a240ba51656d05252fc1c9c7e7ada8f
          extract assets/util_functions.sh manager/app/src/main/assets/magisk/util_functions.sh \
            efe385ffdb72c7fc9b5bcef4267acc4f68ad73b2ac02bb577328f77ea66643eb
          extract assets/stub.apk manager/app/src/main/assets/magisk/stub.apk \
            f0230e0864be255d963befa929ae1c0bb85c4df3e3578bb6cecc3049b6881eb0

          # arm64-v8a
          extract lib/arm64-v8a/libmagiskboot.so  manager/app/src/main/jniLibs/arm64-v8a/libmagiskboot.so  d7440e2cd89899426e809554bf793baef9804ccbe5a52ce34a8b6242725d3c77
          extract lib/arm64-v8a/libmagiskinit.so  manager/app/src/main/jniLibs/arm64-v8a/libxecbootinit.so  383670a7ba3a6a4b79e5f3467e1da4b66a5df66a9b356ab9f70916854dd6b468
          extract lib/arm64-v8a/libmagisk.so      manager/app/src/main/jniLibs/arm64-v8a/libxeccoresu.so      2d8419018dda41f7d9aca94c0ca8f926f3b8447ca5cf7fb71faeb8d05e29694e
          extract lib/arm64-v8a/libinit-ld.so     manager/app/src/main/jniLibs/arm64-v8a/libinit-ld.so     c71e69780bb7ce6d6c26b2d794a3c631689bed130519762716fee285a10417f0
          extract lib/arm64-v8a/libbusybox.so     manager/app/src/main/jniLibs/arm64-v8a/libbusybox.so     4d60ab3f5a59ebb2ca863f2f514e6924401b581e9b64f602665c008177626651
          extract lib/arm64-v8a/libmagiskpolicy.so manager/app/src/main/jniLibs/arm64-v8a/libmagiskpolicy.so 9837db9db475eb74b6715f081768cb6a1f2fb5a2b2ac15755686062501bace27

          # x86_64（模拟器/少数设备；管理器两个 ABI 都带）
          extract lib/x86_64/libmagiskboot.so  manager/app/src/main/jniLibs/x86_64/libmagiskboot.so  a18ecbd7981179494b7d281453d6c4e25b5c719e7d2ef7f6eba3c6be3043c58e
          extract lib/x86_64/libmagiskinit.so  manager/app/src/main/jniLibs/x86_64/libxecbootinit.so  24557786f59662376cc9bf204a025d8beb505b9a86cc50a4d1227b34ef2464b6
          extract lib/x86_64/libmagisk.so      manager/app/src/main/jniLibs/x86_64/libxeccoresu.so      a1cc6bea9e8618f8e3dea95a9068b161a256c9e19985fb7dc33c15a50a73e0cb
          extract lib/x86_64/libinit-ld.so     manager/app/src/main/jniLibs/x86_64/libinit-ld.so     54c9f44f160d822c0d0ee9b5f816dfc8be5210f5a3e45b2cebf7404108a74759
          extract lib/x86_64/libbusybox.so     manager/app/src/main/jniLibs/x86_64/libbusybox.so     060844b0769f7a50262854af027c4d6076a212d160a51309b53057cfb7122900
          extract lib/x86_64/libmagiskpolicy.so manager/app/src/main/jniLibs/x86_64/libmagiskpolicy.so 0021aaefac5f5a49dfa5996df44a8a67cd6ec014ade72c2358802bd2cc82650f

          chmod +x manager/app/src/main/jniLibs/*/libmagisk*.so \
                   manager/app/src/main/jniLibs/*/libbusybox.so \
                   manager/app/src/main/jniLibs/*/libinit-ld.so
          file manager/app/src/main/jniLibs/arm64-v8a/libmagiskboot.so
          ls -la manager/app/src/main/assets/magisk/ manager/app/src/main/jniLibs/arm64-v8a/

      - name: Build branded manager
        run: |
          ./gradlew clean assembleRelease \
            -PKSU_PACKAGE_NAME=${{ env.BRAND_PACKAGE }} \
            -PKSU_NAME=${{ env.BRAND_NAME }}

      # Debug 版：内部测试用的可调式包，与正式产物同一套源码、同一套前置载荷。
      # 这里刻意跳过 lint —— debug 变体默认会跑它（release 侧 checkReleaseBuilds=false
      # 已经关掉），一条与本次改动无关的既有告警就会让这个 job 红掉，而这道闸门不该
      # 卡在内部测试包上。
      - name: Build debug manager
        run: |
          ./gradlew :app:assembleDebug -x lint -x lintDebug \
            -PKSU_PACKAGE_NAME=${{ env.BRAND_PACKAGE }} \
            -PKSU_NAME=${{ env.BRAND_NAME }}

      # 本工程没有 debug signingConfig，Gradle 出的 debug 件是**未签名**的，装不上。
      # 而且必须用与正式版同一个 key 签：签名不同的包无法覆盖安装，用户得先卸载、
      # 数据全丢。所以这里直接用 brand keystore 走 zipalign + apksigner。
      - name: Sign the debug APK with the brand key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SIGN_STORE_PASS }}
          KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASS }}
        run: |
          set -euo pipefail
          # 这个 job 有 defaults.run.working-directory: ./manager，所以 run 里的相对
          # 路径都是相对 manager/ 的；而 upload-artifact 的 path 相对的是工作区根，
          # 两者差一层，别照抄。
          BT="$(ls -d "${ANDROID_HOME}"/build-tools/* 2>/dev/null | sort -V | tail -n 1)"
          [ -n "$BT" ] || { echo "::error::no build-tools under ${ANDROID_HOME}"; exit 1; }
          IN="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"
          [ -n "$IN" ] || { echo "::error::no debug apk produced"; exit 1; }
          OUT="app/build/outputs/apk/debug/XECKernelPro-debug-TESTONLY-signed.apk"
          echo "signing $IN -> $OUT"
          "${BT}/zipalign" -f -p 4 "$IN" "${OUT}.aligned"
          "${BT}/apksigner" sign \
            --ks xecpro-key.jks --ks-key-alias xecpro-key \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$OUT" "${OUT}.aligned"
          "${BT}/apksigner" verify "$OUT"
          # 未签名原件别跟着上传，否则产物里两个同名 APK 分不清哪个能装。
          rm -f "$IN" "${OUT}.aligned"
          ls -la app/build/outputs/apk/debug/

      - name: Upload gradle artifact
        uses: actions/upload-artifact@v7
        with:
          name: manager-gradle
          path: manager/app/build/outputs/apk/release/*.apk

      - name: Upload debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: manager-debug
          path: manager/app/build/outputs/apk/debug/*.apk

      # debug 件与正式版同包名、同签名、可双向覆盖，而 debug buildType 默认
      # debuggable=true：任何拿到这个包的人插上电脑，adb run-as 就能进 app uid 读
      # 私有数据（superkey 存储、策略缓存）。这是 debug 构建的固有属性，但它现在披着
      # 正式签名、能平滑盖掉正式版，边界比以前模糊，所以必须写明。
      - name: Note that the debug APK is test-only
        shell: bash
        run: |
          {
            echo '### Debug APK — TEST DEVICES ONLY'
            echo ''
            echo '`manager-debug` is a **debuggable** build signed with the brand key.'
            echo 'It can be installed over the release app and vice versa.'
            echo 'Because it is debuggable, an `adb` session can `run-as` into the app'
            echo 'uid and read private data (superkey storage, policy caches).'
            echo ''
            echo 'Use it on test devices only. Do not use it as a daily driver and do'
            echo 'not redistribute it.'
          } >> "$GITHUB_STEP_SUMMARY"

  repack:
    needs: [build-manager, build-ksud, generate-key]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Android SDK
        shell: bash
        run: |
          set -uo pipefail

          # 同 build-manager：绕开必然失败的 android-actions/setup-android。
          # repack 需要 build-tools 的 zipalign/apksigner 与 NDK 的 llvm-strip。
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "${SDK_ROOT}" ] || [ ! -d "${SDK_ROOT}" ]; then
            SDK_ROOT=""
            for d in /usr/local/lib/android/sdk /opt/android-sdk /opt/android "$HOME/Android/Sdk" "$HOME/android-sdk"; do
              if [ -d "$d" ]; then SDK_ROOT="$d"; break; fi
            done
          fi
          if [ -z "${SDK_ROOT}" ]; then
            echo "::error::no Android SDK found on this runner"
            ls -la /usr/local/lib/android 2>/dev/null || true
            exit 1
          fi
          echo "Android SDK root: ${SDK_ROOT}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"

          SDKMGR="$(find "${SDK_ROOT}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "${SDKMGR}" ]; then
            echo "::error::sdkmanager not found under ${SDK_ROOT}/cmdline-tools"
            find /usr/local /opt "$HOME" -maxdepth 5 -type f -name sdkmanager 2>/dev/null | head -n 20 || true
            exit 1
          fi
          echo "sdkmanager: ${SDKMGR}"
          echo "$(dirname "${SDKMGR}")" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"

          yes | "${SDKMGR}" --sdk_root="${SDK_ROOT}" --licenses > /dev/null 2>&1 || true

          for pkg in "platform-tools" "build-tools;37.0.0" "ndk;29.0.14206865"; do
            echo "--- installing ${pkg}"
            "${SDKMGR}" --sdk_root="${SDK_ROOT}" --install "${pkg}" \
              || echo "::warning::sdkmanager could not install '${pkg}'; falling back to whatever the runner already has"
          done

      - name: Download manager artifact
        uses: actions/download-artifact@v8
        with:
          name: manager-gradle
          path: artifacts/manager-gradle

      - name: Download ksud artifacts
        uses: actions/download-artifact@v8
        with:
          name: ksud-aarch64-linux-android
          path: artifacts/ksud-aarch64-linux-android
      - uses: actions/download-artifact@v8
        with:
          name: ksud-x86_64-linux-android
          path: artifacts/ksud-x86_64-linux-android

      - name: Place manager apk and xudc artifacts
        run: |
          mkdir -p manager/app/build/outputs/apk/release
          APK=$(find artifacts/manager-gradle -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp -f "$APK" manager/app/build/outputs/apk/release/

          mkdir -p target/aarch64-linux-android/release
          mkdir -p target/x86_64-linux-android/release
          ARM64_KSUD=$(find artifacts/ksud-aarch64-linux-android -type f -name xudc | head -n 1)
          X86_64_KSUD=$(find artifacts/ksud-x86_64-linux-android -type f -name xudc | head -n 1)
          test -n "$ARM64_KSUD"
          test -n "$X86_64_KSUD"
          cp -f "$ARM64_KSUD" target/aarch64-linux-android/release/xudc
          cp -f "$X86_64_KSUD" target/x86_64-linux-android/release/xudc

      - name: Sign and repack
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SIGN_STORE_PASS }}
          KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASS }}
          KEYSTORE_B64: ${{ secrets.SIGN_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > xecpro-key.jks
          python3 repack_apk.py repack \
            -b release \
            -t release \
            -a arm64-v8a \
            -K xecpro-key.jks \
            -A xecpro-key \
            -P "$KEYSTORE_PASSWORD" \
            -S "$KEY_PASSWORD" \
            --strip

      - name: Verify Magisk payload survived repack + sign
        # 与 *Fetch Magisk payload* 同一个门控：debug 构建根本不装这条载荷，
        # 这里再去拆 APK 找它必然是"条目缺失"，只会制造假红。
        if: ${{ inputs.publish }}
        # repack 与签名是另一个 job：下载、解包那一步校验过了，打包/重签这一环再掉载荷
        # （AGP 的资源过滤、repack_apk.py 的条目遍历、--strip …）就没人拦得住，而管理器会
        # 把整条 Magisk 路线静默灰掉。这里直接拆开**签发出去的**那个 APK 逐条对齐 sha256。
        # 15 条 pin 与 build-manager 的 *Fetch Magisk payload* 步骤逐字节一致（同一个上游
        # v30.7 APK 的条目内容；APK 里条目的解压内容 = 分发出去的载荷字节，可直接 `unzip -p` 复算）。
        run: |
          set -euo pipefail
          # 要检查的就是**签发出去的**那份 release 件：repack_apk.py 的输入是
          # *Place manager apk and xudc artifacts* 那一步放进
          # manager/app/build/outputs/apk/release/ 的 APK（find_latest_apk() 取 mtime 最新
          # 那个），输出固定为 dist/<输入 APK 的 stem>.apk（output_name 未配置，见
          # repack_apk.py 的 output_name / signed_path），也正是 *Upload branded APK*
          # 上传的 dist/*.apk 里的签名件。这里照着同一条链算路径，不猜名字、不用通配符。
          APK_NAME=$(find manager/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' \
            -printf '%T@ %f\n' 2>/dev/null | sort -n | tail -n 1 | cut -d' ' -f2- || true)
          [ -n "$APK_NAME" ] || {
            echo "::error::no manager APK under manager/app/build/outputs/apk/release"
            exit 1
          }
          APK="dist/${APK_NAME}"
          [ -f "$APK" ] || { echo "::error::repacked release APK not found: ${APK}"; exit 1; }
          echo "checking payload in ${APK}"

          verify() {  # verify <apk-entry> <sha256>
            local entry="$1" sha="$2" tmp
            tmp="$(mktemp)"
            if ! unzip -p "$APK" "$entry" > "$tmp"; then
              rm -f "$tmp"
              echo "::error::Magisk payload entry missing from the repacked APK: ${entry}"
              exit 1
            fi
            if ! echo "${sha}  ${tmp}" | sha256sum -c -; then
              rm -f "$tmp"
              echo "::error::Magisk payload entry changed during repack/sign: ${entry}"
              exit 1
            fi
            rm -f "$tmp"
          }

          verify assets/magisk/boot_patch.sh 20de7208d610a267aaafafe09846c4458a240ba51656d05252fc1c9c7e7ada8f
          verify assets/magisk/util_functions.sh efe385ffdb72c7fc9b5bcef4267acc4f68ad73b2ac02bb577328f77ea66643eb
          verify assets/magisk/stub.apk f0230e0864be255d963befa929ae1c0bb85c4df3e3578bb6cecc3049b6881eb0

          verify lib/arm64-v8a/libmagiskboot.so d7440e2cd89899426e809554bf793baef9804ccbe5a52ce34a8b6242725d3c77
          verify lib/arm64-v8a/libxecbootinit.so 383670a7ba3a6a4b79e5f3467e1da4b66a5df66a9b356ab9f70916854dd6b468
          verify lib/arm64-v8a/libxeccoresu.so 2d8419018dda41f7d9aca94c0ca8f926f3b8447ca5cf7fb71faeb8d05e29694e
          verify lib/arm64-v8a/libinit-ld.so c71e69780bb7ce6d6c26b2d794a3c631689bed130519762716fee285a10417f0
          verify lib/arm64-v8a/libbusybox.so 4d60ab3f5a59ebb2ca863f2f514e6924401b581e9b64f602665c008177626651
          verify lib/arm64-v8a/libmagiskpolicy.so 9837db9db475eb74b6715f081768cb6a1f2fb5a2b2ac15755686062501bace27


          echo "all 9 arm64 Magisk payload entries survived repack + sign"

      - name: Upload branded APK
        uses: actions/upload-artifact@v7
        with:
          name: XECkernelPro-manager
          path: dist/*.apk

  # 发布 GitHub Release，让老版本的“检查更新”能发现新版本。
  # 关键点：release APK 文件名末尾必须带 _<versionCode>，checkNewVersion() 用它做版本比较。
  # 触发条件：**只有** workflow_dispatch 且 publish=true（文件头已说明：本工作流刻意
  # 不监听 push: tags，所以推标签不会跑这里；`github.ref_type == 'tag'` 那半个条件是
  # 给"万一将来加回标签触发"留的，现在恒为假）。
  # 不勾就只出产物（内测包），版本号、标签、Release 都不会动。
  release:
    # guards 必须在 needs 里：它失败时这一步以前照样跑，于是"红构建"也会往已经
    # 发布的 Release 里追加资产。2026-11-05 就这么发生过两次 —— v31347 与 v31348
    # 各被塞进第二个 APK（重跑产物与首发**不是逐字节一致**），用户会看到同一版本
    # 两个不同的安装包。守卫存在的前提是它能挡住下游，不能只是报红。
    needs: [guards, repack, build-ksud, build-ksuinit, build-manager]
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 用 GITHUB_TOKEN 触发 build-lkm 的 workflow_dispatch 必须有 actions:write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download branded APK
        uses: actions/download-artifact@v8
        with:
          name: XECkernelPro-manager
          path: artifacts/manager

      - name: Download ksud (arm64)
        uses: actions/download-artifact@v8
        with:
          name: ksud-aarch64-linux-android
          path: artifacts/ksud-aarch64
      - name: Download ksud (x86_64)
        uses: actions/download-artifact@v8
        with:
          name: ksud-x86_64-linux-android
          path: artifacts/ksud-x86_64

      # 外部分发的两个模块 zip（TEE 引擎 / TA 增强）：内置形态默认不再运行，
      # 需要的人从管理器检测页按 URL 下载并刷入；这里把它们挂到 Release 上做**同一份
      # 产物的官方出处**（管理器默认走自建网盘的 /modules/ 镜像，国内更快）。
      - name: Download externally distributed module zips
        uses: actions/download-artifact@v8
        with:
          name: external-modules
          path: artifacts/external-modules
        continue-on-error: true

      - name: Download ksuinit (arm64)
        uses: actions/download-artifact@v8
        with:
          name: ksuinit-aarch64
          path: artifacts/ksuinit-aarch64
      - name: Download ksuinit (x86_64)
        uses: actions/download-artifact@v8
        with:
          name: ksuinit-x86_64
          path: artifacts/ksuinit-x86_64

      # Release 必须带全 8 个 KMI 的 aarch64 kernelsu.ko（init_boot 修补用）。
      # 注意：reusable workflow 的子 run 不进 runs 索引（gh run list 查不到，
      # 只会拿到空结果），所以这里显式 dispatch 一次 build-lkm（基于当前
      # SHA，溯源反而更准），等它完成后用 download-artifact 拉取。
      # 另外不要用 `gh run download`——它对新版 artifact 的 digest 校验会
      # 误报 "digest-mismatch: error"（比对值相同也报错），必须用
      # actions/download-artifact（与上传端同族工具链）。
      - name: Dispatch build-lkm for this SHA (skip when success run exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # build-lkm.yml 的 workflow_dispatch 没有定义 inputs，不能带 -f。
          # dispatch 的 ref 不接受裸 SHA（422），必须用分支/标签名。
          # 注意：reusable 子 run 不进 runs 索引，只有独立 dispatch 的 run
          # 能被查到；查询一律走 gh api 直连 REST——gh run list 的
          # --workflow/--commit-sha 组合过滤在 Actions 里实测会返回空。
          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-lkm.yml/runs?head_sha=$GITHUB_SHA&per_page=10" \
            --jq '[.workflow_runs[] | select(.status=="completed" and .conclusion=="success")] | length')
          if [ "${EXISTING:-0}" -gt 0 ]; then
            echo "successful build-lkm run already exists for $GITHUB_SHA - skip dispatch"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/build-lkm.yml/dispatches" \
              -f "ref=$GITHUB_REF_NAME"
            sleep 20
          fi

      - name: Wait for build-lkm completion
        id: lkmrun
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for i in $(seq 1 90); do
            INFO=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-lkm.yml/runs?head_sha=$GITHUB_SHA&per_page=20" \
              --jq '[.workflow_runs[] | select(.status=="completed" and .conclusion=="success")][0].id // ""')
            if [ -n "$INFO" ]; then
              echo "successful build-lkm run: $INFO"
              echo "run_id=$INFO" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TOTAL=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-lkm.yml/runs?head_sha=$GITHUB_SHA&per_page=20" \
              --jq '.total_count')
            echo "poll $i: $TOTAL build-lkm run(s) for $GITHUB_SHA, none succeeded yet"
            sleep 60
          done
          echo "::error::build-lkm did not finish in time"; exit 1

      - name: Download kernelsu.ko for all KMIs
        uses: actions/download-artifact@v8
        with:
          pattern: aarch64-*-lkm
          run-id: ${{ steps.lkmrun.outputs.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/ko-raw

      - name: Collect kernelsu.ko files
        run: |
          set -e
          KMIS="android12-5.10 android13-5.10 android13-5.15 android14-5.15 android14-6.1 android15-6.6 android16-6.12 android17-6.18"
          mkdir -p artifacts/ko
          for KMI in $KMIS; do
            KO=$(find "artifacts/ko-raw/aarch64-$KMI-lkm" -type f -name "*_kernelsu.ko" 2>/dev/null | head -n 1)
            [ -n "$KO" ] || KO=$(find "artifacts/ko-raw" -path "*aarch64-$KMI-lkm*" -type f -name "*_kernelsu.ko" | head -n 1)
            [ -n "$KO" ] || { echo "::error::no kernelsu.ko in artifact aarch64-$KMI-lkm"; exit 1; }
            cp -f "$KO" "artifacts/ko/aarch64-${KMI}_kernelsu.ko"
          done
          ls -la artifacts/ko/

      # XecHide 已下架、Zygisk Next 许可证不允许再分发：Release 资产不再包含
      # XecHide-module-*.zip 与 Zygisk-Next-*.zip，历史 Release 上的同名资产也已清理。
      # 需要 Zygisk 框架的用户请自行从官方仓库获取：https://github.com/LSPosed/ZygiskNext

      - name: Resolve release tag
        id: tag
        env:
          SEMVER: ${{ inputs.semver }}
        run: |
          ok_semver() {
            printf '%s' "$1" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9]+)?)?$'
          }
          is_pre() {
            printf '%s' "$1" | grep -Eq -- '-(alpha|beta|rc)(\.[0-9]+)?$'
          }
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
            # 推 tag 发版：含 alpha/beta/rc 段即 Pre-Release（历史 v<码>-<哈希> 不含这些段，仍算正式版）
            if is_pre "$TAG"; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; fi
          elif [ -n "$SEMVER" ]; then
            SEMVER="${SEMVER#v}"
            if ! ok_semver "$SEMVER"; then
              echo "::error::semver 非法: '$SEMVER'（须为 主.次.修订[-alpha|-beta|-rc[.N]]）"; exit 1
            fi
            echo "tag_name=v$SEMVER" >> "$GITHUB_OUTPUT"
            if is_pre "$SEMVER"; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; fi
          else
            # 版本码不认识提交数：单一真源是仓库根的 version.properties。
            # 从提交数推过一次（31000+count），切分支时把公开版本号从 31346 倒退成 31279，
            # 已安装的用户永远收不到更新；所以这里也直接读文件，读不到就失败。
            VCODE=$(sed -n 's/^versionCode[[:space:]]*=[[:space:]]*//p' version.properties | head -n 1)
            if ! printf '%s' "$VCODE" | grep -Eq '^[0-9]+$'; then
              echo "::error::version.properties 里没有合法的 versionCode（读到 '$VCODE'）"; exit 1
            fi
            SHA=$(git rev-parse --short=8 HEAD)
            echo "tag_name=v${VCODE}-${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          generate_release_notes: true
          # 草稿：Release 和全部资产照常生成、可下载，但**不对用户公开**——
          # 公开 API、检查更新、官网都看不到，只有仓库管理员在 Releases 页面里能看见
          # 并手动发布。默认 true，因为"构建一个候选正式版"和"把它推给用户"是两件事，
          # 后者必须显式关掉草稿才算数。
          draft: ${{ inputs.draft }}
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          # 只上传 aarch64 的 xudc / ksuinit。
          # 此前同时列出 x86_64 目录，而两个目录里的文件名都是 xudc / ksuinit，
          # action-gh-release 上传第二个同名文件时要去 PATCH 已存在 asset 的元数据，
          # 拿到 404 后抛错：job 失败、Release 停在 draft 状态，公开 API 读不到，
          # 管理器的检查更新因此完全无感。Android 设备是 arm64，保留 aarch64 即可。
          files: |
            artifacts/manager/*.apk
            artifacts/ksud-aarch64/*
            artifacts/ksuinit-aarch64/*
            artifacts/ko/*
            artifacts/external-modules/*.zip
