name: Build XECKernelPro

# 品牌化专用构建流水线。
# 使用方式:
#   1. 把本仓库推送到你自己的 GitHub 仓库
#   2. Actions -> Build XECKernelPro -> Run workflow
#   3. 跑完后在 "Artifacts" 里下载打好的 XECkernelPro 管理器 APK
# 签名密钥不入库：使用仓库 Secrets（SIGN_KEYSTORE_B64 / SIGN_STORE_PASS /
# SIGN_KEY_PASS），密钥内容与原仓库内 xecpro-key.jks 完全相同，签名结果不变。

on:
  workflow_dispatch:
    inputs:
      publish:
        # 默认 false：手动跑一次只是**出构建产物**（内测 APK），不会创建 Release、不动版本号。
        # 要发版必须显式勾上，或者推 v* 标签（标签触发永远发版）。
        # 这条闸门是 2026-10-15 加的：之前手动 dispatch 一定会走到 release job，
        # 内测构建得靠"盯着 run 手动取消"，一次没取消干净就会把没确认的版本发出去。
        description: '创建 GitHub Release（发版）。只出内测包请保持关闭'
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  SIGN_KEY_ALIAS: xecpro-key
  BRAND_PACKAGE: com.xecpro.kernel
  BRAND_NAME: XECKernelPro

jobs:
  generate-key:
    runs-on: ubuntu-latest
    steps:
      - name: Verify signing secrets present
        env:
          SIGN_KEYSTORE_B64: ${{ secrets.SIGN_KEYSTORE_B64 }}
          SIGN_STORE_PASS: ${{ secrets.SIGN_STORE_PASS }}
          SIGN_KEY_PASS: ${{ secrets.SIGN_KEY_PASS }}
        run: |
          # 注意：secret 不能经 job outputs 传给下游（Actions 会 Skip output
          # since it may contain secret），每个 job 必须直读 secrets.*。
          # 本 job 只做早期哨兵校验，真正的解码在各自消费步骤完成。
          [ -n "$SIGN_KEYSTORE_B64" ] || { echo "::error::secret SIGN_KEYSTORE_B64 not set"; exit 1; }
          [ -n "$SIGN_STORE_PASS" ] || { echo "::error::secret SIGN_STORE_PASS not set"; exit 1; }
          [ -n "$SIGN_KEY_PASS" ] || { echo "::error::secret SIGN_KEY_PASS not set"; exit 1; }
          echo "signing secrets present"

  build-lkm:
    needs: generate-key
    uses: ./.github/workflows/build-lkm.yml
    with:
      # Upstream replaced the expected_size2/expected_hash2 inputs with the
      # KSU_IS_PR_BUILD mechanism, so the call must use the current contract or
      # Actions fails the run at startup ("not defined in the referenced
      # workflow"). kernel/Kbuild already defaults EXPECTED_SIZE/HASH to our
      # release key, and the package name is pinned here explicitly.
      package_name: com.xecpro.kernel
    secrets: inherit

  build-ksuinit:
    uses: ./.github/workflows/ksuinit.yml

  build-xecinit:
    uses: ./.github/workflows/xecinit.yml

  # ③ KPM 产品化：susfs_lite.kpm 必须对真内核树编译（kretprobe/pt_regs 结构
  # 布局来自目标内核头；freestanding 硬编偏移=布局赌博）。ddk-min 容器自带
  # 预备好的内核树（$KDIR，含 generated 头），对 android15-6.6 编出 ET_REL。
  build-kpm:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build susfs_lite.kpm against android15-6.6 headers
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "KDIR=${KDIR:-<unset>}"
          if [ -z "${KDIR:-}" ]; then
            # 镜像应导出 KDIR；兜底按 ddk-min 的目录约定找第一个预备树。
            KDIR="$(ls -d /opt/ddk/kdir/* 2>/dev/null | head -n 1)"
            echo "KDIR=$KDIR" >> "$GITHUB_ENV"
            echo "fallback KDIR=$KDIR"
          fi
          test -f "$KDIR/include/generated/autoconf.h" || {
            echo "::error::prepared kernel tree missing generated headers: $KDIR"
            ls "$KDIR" || true
            exit 1
          }
          make -C kpm_samples/susfs_lite KDIR="$KDIR"
          ls -la kpm_samples/susfs_lite/susfs_lite.kpm
          # 守卫：.kpm.* 节必须在（装载器按节取 init/ctl0/exit 指针）。
          READELF="$(command -v llvm-readelf || command -v readelf)"
          SECS=$("$READELF" -S kpm_samples/susfs_lite/susfs_lite.kpm | grep -c '\.kpm\.')
          echo ".kpm sections: $SECS"
          [ "$SECS" -ge 4 ] || { echo "::error::expected >=4 .kpm sections, got $SECS"; exit 1; }

      - name: Upload built-in KPM payload
        uses: actions/upload-artifact@v7
        with:
          name: builtin-kpm
          path: kpm_samples/susfs_lite/susfs_lite.kpm

  build-ksud:
    needs: [build-lkm, build-ksuinit, build-xecinit]
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
          - target: x86_64-linux-android
    uses: ./.github/workflows/ksud.yml
    with:
      target: ${{ matrix.target }}
      pack_lkm: true
      pack_ksuinit: true
      pack_xecinit: true

  build-manager:
    needs: [generate-key, build-kpm]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write brand keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SIGN_STORE_PASS }}
          KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASS }}
          KEYSTORE_B64: ${{ secrets.SIGN_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > xecpro-key.jks
          {
            echo KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            echo KEY_ALIAS='xecpro-key'
            echo KEY_PASSWORD="$KEY_PASSWORD"
            echo KEYSTORE_FILE='xecpro-key.jks'
          } >> gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        shell: bash
        run: |
          set -uo pipefail

          # 不用 android-actions/setup-android：它会无条件执行 `sdkmanager tools`，
          # 而 Google 已下架 tools 包，导致该 action 必然以 exit 1 收尾并中断 job。
          # 这里直接复用 runner 镜像自带的 Android SDK + cmdline-tools。
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "${SDK_ROOT}" ] || [ ! -d "${SDK_ROOT}" ]; then
            SDK_ROOT=""
            for d in /usr/local/lib/android/sdk /opt/android-sdk /opt/android "$HOME/Android/Sdk" "$HOME/android-sdk"; do
              if [ -d "$d" ]; then SDK_ROOT="$d"; break; fi
            done
          fi
          if [ -z "${SDK_ROOT}" ]; then
            echo "::error::no Android SDK found on this runner"
            ls -la /usr/local/lib/android 2>/dev/null || true
            exit 1
          fi
          echo "Android SDK root: ${SDK_ROOT}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"

          SDKMGR="$(find "${SDK_ROOT}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "${SDKMGR}" ]; then
            echo "::error::sdkmanager not found under ${SDK_ROOT}/cmdline-tools"
            find /usr/local /opt "$HOME" -maxdepth 5 -type f -name sdkmanager 2>/dev/null | head -n 20 || true
            exit 1
          fi
          echo "sdkmanager: ${SDKMGR}"
          echo "$(dirname "${SDKMGR}")" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"

          # 先接受全部 license，保证 sdkmanager 与 AGP 的自动下载都不会被卡住。
          yes | "${SDKMGR}" --sdk_root="${SDK_ROOT}" --licenses > /dev/null 2>&1 || true

          # 逐包安装：个别包名即使不存在，也不会中断其余包。
          for pkg in "platform-tools" "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865"; do
            echo "--- installing ${pkg}"
            "${SDKMGR}" --sdk_root="${SDK_ROOT}" --install "${pkg}" \
              || echo "::warning::sdkmanager could not install '${pkg}'; Gradle will try to auto-download it"
          done

          ls "${SDK_ROOT}/build-tools" 2>/dev/null || true
          ls "${SDK_ROOT}/platforms" 2>/dev/null || true
          ls "${SDK_ROOT}/ndk" 2>/dev/null || true

      - name: Build GhostLock native payload
        # vendored third_party/ghostlock (see UPSTREAM.md); the PIE binary is
        # shipped as jniLibs/arm64-v8a/libghostlock.so so it can be exec'd
        # straight from nativeLibraryDir (useLegacyPackaging is enabled).
        working-directory: .
        run: |
          set -euo pipefail
          NDK_DIR="$(ls -d "${ANDROID_SDK_ROOT:-${ANDROID_HOME:?}}"/ndk/* 2>/dev/null | sort | tail -n 1)"
          if [ -z "$NDK_DIR" ]; then
            echo "::error::no NDK found under the Android SDK"
            exit 1
          fi
          echo "NDK: ${NDK_DIR}"
          make -C third_party/ghostlock/src NDK_ROOT="$NDK_DIR" -j"$(nproc)"
          "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            --strip-unneeded third_party/ghostlock/build/native/ghostlock
          mkdir -p manager/app/src/main/jniLibs/arm64-v8a
          cp -f third_party/ghostlock/build/native/ghostlock \
            manager/app/src/main/jniLibs/arm64-v8a/libghostlock.so
          file manager/app/src/main/jniLibs/arm64-v8a/libghostlock.so
          ls -la manager/app/src/main/jniLibs/arm64-v8a/

      - name: Fetch KPatch binaries (<5.10 kernel route)
        # KernelPatch 路线（5.10 以下内核）：kptools-android 打进 jniLibs
        # （libkptools.so，可从 nativeLibraryDir exec），kpimg 进 assets。
        # 版本与 sha256 固定在 KernelSU-Next/KPatch-Next 0.13.5-2（GPL-2.0）。
        working-directory: .
        run: |
          set -euo pipefail
          BASE="https://github.com/KernelSU-Next/KPatch-Next/releases/download/0.13.5-2"
          fetch() {
            local name="$1" sha="$2" dest="$3"
            curl -fsSL --retry 3 -o "/tmp/${name}" "${BASE}/${name}"
            echo "${sha}  /tmp/${name}" | sha256sum -c -
            mkdir -p "$(dirname "${dest}")"
            cp -f "/tmp/${name}" "${dest}"
          }
          fetch kptools-android aced6809a27e61604934349396de33fc98c91ad8b0b3c10959750e1956a63660 \
            manager/app/src/main/jniLibs/arm64-v8a/libkptools.so
          fetch kpimg-linux 943ce69cb00ed7aaff988da9a3fdda89004ba813b2c30aa4a843c642542d4cde \
            manager/app/src/main/assets/kpatch/kpimg
          chmod +x manager/app/src/main/jniLibs/arm64-v8a/libkptools.so
          file manager/app/src/main/jniLibs/arm64-v8a/libkptools.so
          ls -la manager/app/src/main/assets/kpatch/

      - name: Fetch Magisk payload (<5.10 mount-state route)
        # 方案甲：5.10 以下的挂载态 root 直接用 Magisk 官方的修补方式。
        # 载荷**原样**取自 topjohnwu/Magisk v30.7（GPL-3.0，见 THIRD_PARTY_NOTICES.md），
        # 一个字节都不改；只按 boot_patch.sh 头部写明的目录契约改名落地：
        #   assets/magisk/{boot_patch.sh,util_functions.sh,stub.apk}
        #   jniLibs/<abi>/{libmagiskboot,libmagiskinit,libmagisk,libinit-ld,
        #                  libbusybox,libmagiskpolicy}.so
        # 每个文件都单独校验 sha256（不放心的不止是下载是否完整，也包括中间被替换）。
        working-directory: .
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/magisk.apk \
            https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk
          echo "e0d32d2123532860f97123d927b1bb86c4e08e6fd8a48bfc6b5bee0afae9ebd5  /tmp/magisk.apk" \
            | sha256sum -c -

          extract() {  # extract <apk-entry> <dest> <sha256>
            local entry="$1" dest="$2" sha="$3"
            mkdir -p "$(dirname "${dest}")"
            unzip -p /tmp/magisk.apk "${entry}" > "${dest}"
            echo "${sha}  ${dest}" | sha256sum -c -
          }

          extract assets/boot_patch.sh manager/app/src/main/assets/magisk/boot_patch.sh \
            20de7208d610a267aaafafe09846c4458a240ba51656d05252fc1c9c7e7ada8f
          extract assets/util_functions.sh manager/app/src/main/assets/magisk/util_functions.sh \
            efe385ffdb72c7fc9b5bcef4267acc4f68ad73b2ac02bb577328f77ea66643eb
          extract assets/stub.apk manager/app/src/main/assets/magisk/stub.apk \
            f0230e0864be255d963befa929ae1c0bb85c4df3e3578bb6cecc3049b6881eb0

          # arm64-v8a
          extract lib/arm64-v8a/libmagiskboot.so  manager/app/src/main/jniLibs/arm64-v8a/libmagiskboot.so  d7440e2cd89899426e809554bf793baef9804ccbe5a52ce34a8b6242725d3c77
          extract lib/arm64-v8a/libmagiskinit.so  manager/app/src/main/jniLibs/arm64-v8a/libmagiskinit.so  383670a7ba3a6a4b79e5f3467e1da4b66a5df66a9b356ab9f70916854dd6b468
          extract lib/arm64-v8a/libmagisk.so      manager/app/src/main/jniLibs/arm64-v8a/libmagisk.so      2d8419018dda41f7d9aca94c0ca8f926f3b8447ca5cf7fb71faeb8d05e29694e
          extract lib/arm64-v8a/libinit-ld.so     manager/app/src/main/jniLibs/arm64-v8a/libinit-ld.so     c71e69780bb7ce6d6c26b2d794a3c631689bed130519762716fee285a10417f0
          extract lib/arm64-v8a/libbusybox.so     manager/app/src/main/jniLibs/arm64-v8a/libbusybox.so     4d60ab3f5a59ebb2ca863f2f514e6924401b581e9b64f602665c008177626651
          extract lib/arm64-v8a/libmagiskpolicy.so manager/app/src/main/jniLibs/arm64-v8a/libmagiskpolicy.so 9837db9db475eb74b6715f081768cb6a1f2fb5a2b2ac15755686062501bace27

          # x86_64（模拟器/少数设备；管理器两个 ABI 都带）
          extract lib/x86_64/libmagiskboot.so  manager/app/src/main/jniLibs/x86_64/libmagiskboot.so  a18ecbd7981179494b7d281453d6c4e25b5c719e7d2ef7f6eba3c6be3043c58e
          extract lib/x86_64/libmagiskinit.so  manager/app/src/main/jniLibs/x86_64/libmagiskinit.so  24557786f59662376cc9bf204a025d8beb505b9a86cc50a4d1227b34ef2464b6
          extract lib/x86_64/libmagisk.so      manager/app/src/main/jniLibs/x86_64/libmagisk.so      a1cc6bea9e8618f8e3dea95a9068b161a256c9e19985fb7dc33c15a50a73e0cb
          extract lib/x86_64/libinit-ld.so     manager/app/src/main/jniLibs/x86_64/libinit-ld.so     54c9f44f160d822c0d0ee9b5f816dfc8be5210f5a3e45b2cebf7404108a74759
          extract lib/x86_64/libbusybox.so     manager/app/src/main/jniLibs/x86_64/libbusybox.so     060844b0769f7a50262854af027c4d6076a212d160a51309b53057cfb7122900
          extract lib/x86_64/libmagiskpolicy.so manager/app/src/main/jniLibs/x86_64/libmagiskpolicy.so 0021aaefac5f5a49dfa5996df44a8a67cd6ec014ade72c2358802bd2cc82650f

          chmod +x manager/app/src/main/jniLibs/*/libmagisk*.so \
                   manager/app/src/main/jniLibs/*/libbusybox.so \
                   manager/app/src/main/jniLibs/*/libinit-ld.so
          file manager/app/src/main/jniLibs/arm64-v8a/libmagiskboot.so
          ls -la manager/app/src/main/assets/magisk/ manager/app/src/main/jniLibs/arm64-v8a/

      - name: Download built-in KPM artifact
        uses: actions/download-artifact@v8
        with:
          name: builtin-kpm
          path: artifacts/builtin-kpm

      - name: Place built-in KPM payload into assets
        # ③ build-kpm job 用真内核树编出的 susfs_lite.kpm，打进 APK assets/kpm/；
        # 管理器 KPM 页的「内置加载」入口从这里提取（KsuCli.flashBuiltinSusfsLite）。
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p manager/app/src/main/assets/kpm
          cp -f artifacts/builtin-kpm/susfs_lite.kpm manager/app/src/main/assets/kpm/susfs_lite.kpm
          file manager/app/src/main/assets/kpm/susfs_lite.kpm
          ls -la manager/app/src/main/assets/kpm/

      - name: Build branded manager
        run: |
          ./gradlew clean assembleRelease \
            -PKSU_PACKAGE_NAME=${{ env.BRAND_PACKAGE }} \
            -PKSU_NAME=${{ env.BRAND_NAME }}

      - name: Upload gradle artifact
        uses: actions/upload-artifact@v7
        with:
          name: manager-gradle
          path: manager/app/build/outputs/apk/release/*.apk

  repack:
    needs: [build-manager, build-ksud, generate-key]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Android SDK
        shell: bash
        run: |
          set -uo pipefail

          # 同 build-manager：绕开必然失败的 android-actions/setup-android。
          # repack 需要 build-tools 的 zipalign/apksigner 与 NDK 的 llvm-strip。
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "${SDK_ROOT}" ] || [ ! -d "${SDK_ROOT}" ]; then
            SDK_ROOT=""
            for d in /usr/local/lib/android/sdk /opt/android-sdk /opt/android "$HOME/Android/Sdk" "$HOME/android-sdk"; do
              if [ -d "$d" ]; then SDK_ROOT="$d"; break; fi
            done
          fi
          if [ -z "${SDK_ROOT}" ]; then
            echo "::error::no Android SDK found on this runner"
            ls -la /usr/local/lib/android 2>/dev/null || true
            exit 1
          fi
          echo "Android SDK root: ${SDK_ROOT}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"

          SDKMGR="$(find "${SDK_ROOT}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "${SDKMGR}" ]; then
            echo "::error::sdkmanager not found under ${SDK_ROOT}/cmdline-tools"
            find /usr/local /opt "$HOME" -maxdepth 5 -type f -name sdkmanager 2>/dev/null | head -n 20 || true
            exit 1
          fi
          echo "sdkmanager: ${SDKMGR}"
          echo "$(dirname "${SDKMGR}")" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"

          yes | "${SDKMGR}" --sdk_root="${SDK_ROOT}" --licenses > /dev/null 2>&1 || true

          for pkg in "platform-tools" "build-tools;37.0.0" "ndk;29.0.14206865"; do
            echo "--- installing ${pkg}"
            "${SDKMGR}" --sdk_root="${SDK_ROOT}" --install "${pkg}" \
              || echo "::warning::sdkmanager could not install '${pkg}'; falling back to whatever the runner already has"
          done

      - name: Download manager artifact
        uses: actions/download-artifact@v8
        with:
          name: manager-gradle
          path: artifacts/manager-gradle

      - name: Download ksud artifacts
        uses: actions/download-artifact@v8
        with:
          name: ksud-aarch64-linux-android
          path: artifacts/ksud-aarch64-linux-android
      - uses: actions/download-artifact@v8
        with:
          name: ksud-x86_64-linux-android
          path: artifacts/ksud-x86_64-linux-android

      - name: Place manager apk and xudc artifacts
        run: |
          mkdir -p manager/app/build/outputs/apk/release
          APK=$(find artifacts/manager-gradle -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp -f "$APK" manager/app/build/outputs/apk/release/

          mkdir -p target/aarch64-linux-android/release
          mkdir -p target/x86_64-linux-android/release
          ARM64_KSUD=$(find artifacts/ksud-aarch64-linux-android -type f -name xudc | head -n 1)
          X86_64_KSUD=$(find artifacts/ksud-x86_64-linux-android -type f -name xudc | head -n 1)
          test -n "$ARM64_KSUD"
          test -n "$X86_64_KSUD"
          cp -f "$ARM64_KSUD" target/aarch64-linux-android/release/xudc
          cp -f "$X86_64_KSUD" target/x86_64-linux-android/release/xudc

      - name: Sign and repack
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SIGN_STORE_PASS }}
          KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASS }}
          KEYSTORE_B64: ${{ secrets.SIGN_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > xecpro-key.jks
          python3 repack_apk.py repack \
            -b release \
            -t release \
            -a arm64-v8a \
            -a x86_64 \
            -K xecpro-key.jks \
            -A xecpro-key \
            -P "$KEYSTORE_PASSWORD" \
            -S "$KEY_PASSWORD" \
            --strip

      - name: Verify Magisk payload survived repack + sign
        # repack 与签名是另一个 job：下载、解包那一步校验过了，打包/重签这一环再掉载荷
        # （AGP 的资源过滤、repack_apk.py 的条目遍历、--strip …）就没人拦得住，而管理器会
        # 把整条 Magisk 路线静默灰掉。这里直接拆开**签发出去的**那个 APK 逐条对齐 sha256。
        # 15 条 pin 与 build-manager 的 *Fetch Magisk payload* 步骤逐字节一致（同一个上游
        # v30.7 APK 的条目内容；APK 里条目的解压内容 = 分发出去的载荷字节，可直接 `unzip -p` 复算）。
        run: |
          set -euo pipefail
          # 要检查的就是**签发出去的**那份 release 件：repack_apk.py 的输入是
          # *Place manager apk and xudc artifacts* 那一步放进
          # manager/app/build/outputs/apk/release/ 的 APK（find_latest_apk() 取 mtime 最新
          # 那个），输出固定为 dist/<输入 APK 的 stem>.apk（output_name 未配置，见
          # repack_apk.py 的 output_name / signed_path），也正是 *Upload branded APK*
          # 上传的 dist/*.apk 里的签名件。这里照着同一条链算路径，不猜名字、不用通配符。
          APK_NAME=$(find manager/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' \
            -printf '%T@ %f\n' 2>/dev/null | sort -n | tail -n 1 | cut -d' ' -f2- || true)
          [ -n "$APK_NAME" ] || {
            echo "::error::no manager APK under manager/app/build/outputs/apk/release"
            exit 1
          }
          APK="dist/${APK_NAME}"
          [ -f "$APK" ] || { echo "::error::repacked release APK not found: ${APK}"; exit 1; }
          echo "checking payload in ${APK}"

          verify() {  # verify <apk-entry> <sha256>
            local entry="$1" sha="$2" tmp
            tmp="$(mktemp)"
            if ! unzip -p "$APK" "$entry" > "$tmp"; then
              rm -f "$tmp"
              echo "::error::Magisk payload entry missing from the repacked APK: ${entry}"
              exit 1
            fi
            if ! echo "${sha}  ${tmp}" | sha256sum -c -; then
              rm -f "$tmp"
              echo "::error::Magisk payload entry changed during repack/sign: ${entry}"
              exit 1
            fi
            rm -f "$tmp"
          }

          verify assets/magisk/boot_patch.sh 20de7208d610a267aaafafe09846c4458a240ba51656d05252fc1c9c7e7ada8f
          verify assets/magisk/util_functions.sh efe385ffdb72c7fc9b5bcef4267acc4f68ad73b2ac02bb577328f77ea66643eb
          verify assets/magisk/stub.apk f0230e0864be255d963befa929ae1c0bb85c4df3e3578bb6cecc3049b6881eb0

          verify lib/arm64-v8a/libmagiskboot.so d7440e2cd89899426e809554bf793baef9804ccbe5a52ce34a8b6242725d3c77
          verify lib/arm64-v8a/libmagiskinit.so 383670a7ba3a6a4b79e5f3467e1da4b66a5df66a9b356ab9f70916854dd6b468
          verify lib/arm64-v8a/libmagisk.so 2d8419018dda41f7d9aca94c0ca8f926f3b8447ca5cf7fb71faeb8d05e29694e
          verify lib/arm64-v8a/libinit-ld.so c71e69780bb7ce6d6c26b2d794a3c631689bed130519762716fee285a10417f0
          verify lib/arm64-v8a/libbusybox.so 4d60ab3f5a59ebb2ca863f2f514e6924401b581e9b64f602665c008177626651
          verify lib/arm64-v8a/libmagiskpolicy.so 9837db9db475eb74b6715f081768cb6a1f2fb5a2b2ac15755686062501bace27

          verify lib/x86_64/libmagiskboot.so a18ecbd7981179494b7d281453d6c4e25b5c719e7d2ef7f6eba3c6be3043c58e
          verify lib/x86_64/libmagiskinit.so 24557786f59662376cc9bf204a025d8beb505b9a86cc50a4d1227b34ef2464b6
          verify lib/x86_64/libmagisk.so a1cc6bea9e8618f8e3dea95a9068b161a256c9e19985fb7dc33c15a50a73e0cb
          verify lib/x86_64/libinit-ld.so 54c9f44f160d822c0d0ee9b5f816dfc8be5210f5a3e45b2cebf7404108a74759
          verify lib/x86_64/libbusybox.so 060844b0769f7a50262854af027c4d6076a212d160a51309b53057cfb7122900
          verify lib/x86_64/libmagiskpolicy.so 0021aaefac5f5a49dfa5996df44a8a67cd6ec014ade72c2358802bd2cc82650f

          echo "all 15 Magisk payload entries survived repack + sign"

      - name: Upload branded APK
        uses: actions/upload-artifact@v7
        with:
          name: XECkernelPro-manager
          path: dist/*.apk

  # 发布 GitHub Release，让老版本的“检查更新”能发现新版本。
  # 关键点：release APK 文件名末尾必须带 _<versionCode>，checkNewVersion() 用它做版本比较。
  # 触发条件：推 v* 标签（永远发版）；手动 dispatch 必须显式勾上 publish=true。
  # 不勾就只出产物（内测包），版本号、标签、Release 都不会动。
  release:
    needs: [repack, build-ksud, build-ksuinit]
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 用 GITHUB_TOKEN 触发 build-lkm 的 workflow_dispatch 必须有 actions:write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download branded APK
        uses: actions/download-artifact@v8
        with:
          name: XECkernelPro-manager
          path: artifacts/manager

      - name: Download ksud (arm64)
        uses: actions/download-artifact@v8
        with:
          name: ksud-aarch64-linux-android
          path: artifacts/ksud-aarch64
      - name: Download ksud (x86_64)
        uses: actions/download-artifact@v8
        with:
          name: ksud-x86_64-linux-android
          path: artifacts/ksud-x86_64

      # 外部分发的两个模块 zip（TEE 引擎 / TA 增强）：内置形态默认不再运行，
      # 需要的人从管理器检测页按 URL 下载并刷入；这里把它们挂到 Release 上做**同一份
      # 产物的官方出处**（管理器默认走自建网盘的 /modules/ 镜像，国内更快）。
      - name: Download externally distributed module zips
        uses: actions/download-artifact@v8
        with:
          name: external-modules
          path: artifacts/external-modules
        continue-on-error: true

      - name: Download ksuinit (arm64)
        uses: actions/download-artifact@v8
        with:
          name: ksuinit-aarch64
          path: artifacts/ksuinit-aarch64
      - name: Download ksuinit (x86_64)
        uses: actions/download-artifact@v8
        with:
          name: ksuinit-x86_64
          path: artifacts/ksuinit-x86_64

      # Release 必须带全 8 个 KMI 的 aarch64 kernelsu.ko（init_boot 修补用）。
      # 注意：reusable workflow 的子 run 不进 runs 索引（gh run list 查不到，
      # 只会拿到空结果），所以这里显式 dispatch 一次 build-lkm（基于当前
      # SHA，溯源反而更准），等它完成后用 download-artifact 拉取。
      # 另外不要用 `gh run download`——它对新版 artifact 的 digest 校验会
      # 误报 "digest-mismatch: error"（比对值相同也报错），必须用
      # actions/download-artifact（与上传端同族工具链）。
      - name: Dispatch build-lkm for this SHA (skip when success run exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # build-lkm.yml 的 workflow_dispatch 没有定义 inputs，不能带 -f。
          # dispatch 的 ref 不接受裸 SHA（422），必须用分支/标签名。
          # 注意：reusable 子 run 不进 runs 索引，只有独立 dispatch 的 run
          # 能被查到；查询一律走 gh api 直连 REST——gh run list 的
          # --workflow/--commit-sha 组合过滤在 Actions 里实测会返回空。
          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-lkm.yml/runs?head_sha=$GITHUB_SHA&per_page=10" \
            --jq '[.workflow_runs[] | select(.status=="completed" and .conclusion=="success")] | length')
          if [ "${EXISTING:-0}" -gt 0 ]; then
            echo "successful build-lkm run already exists for $GITHUB_SHA - skip dispatch"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/build-lkm.yml/dispatches" \
              -f "ref=$GITHUB_REF_NAME"
            sleep 20
          fi

      - name: Wait for build-lkm completion
        id: lkmrun
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for i in $(seq 1 90); do
            INFO=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-lkm.yml/runs?head_sha=$GITHUB_SHA&per_page=20" \
              --jq '[.workflow_runs[] | select(.status=="completed" and .conclusion=="success")][0].id // ""')
            if [ -n "$INFO" ]; then
              echo "successful build-lkm run: $INFO"
              echo "run_id=$INFO" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TOTAL=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-lkm.yml/runs?head_sha=$GITHUB_SHA&per_page=20" \
              --jq '.total_count')
            echo "poll $i: $TOTAL build-lkm run(s) for $GITHUB_SHA, none succeeded yet"
            sleep 60
          done
          echo "::error::build-lkm did not finish in time"; exit 1

      - name: Download kernelsu.ko for all KMIs
        uses: actions/download-artifact@v8
        with:
          pattern: aarch64-*-lkm
          run-id: ${{ steps.lkmrun.outputs.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/ko-raw

      - name: Collect kernelsu.ko files
        run: |
          set -e
          KMIS="android12-5.10 android13-5.10 android13-5.15 android14-5.15 android14-6.1 android15-6.6 android16-6.12 android17-6.18"
          mkdir -p artifacts/ko
          for KMI in $KMIS; do
            KO=$(find "artifacts/ko-raw/aarch64-$KMI-lkm" -type f -name "*_kernelsu.ko" 2>/dev/null | head -n 1)
            [ -n "$KO" ] || KO=$(find "artifacts/ko-raw" -path "*aarch64-$KMI-lkm*" -type f -name "*_kernelsu.ko" | head -n 1)
            [ -n "$KO" ] || { echo "::error::no kernelsu.ko in artifact aarch64-$KMI-lkm"; exit 1; }
            cp -f "$KO" "artifacts/ko/aarch64-${KMI}_kernelsu.ko"
          done
          ls -la artifacts/ko/

      # XecHide 已下架、Zygisk Next 许可证不允许再分发：Release 资产不再包含
      # XecHide-module-*.zip 与 Zygisk-Next-*.zip，历史 Release 上的同名资产也已清理。
      # 需要 Zygisk 框架的用户请自行从官方仓库获取：https://github.com/LSPosed/ZygiskNext

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            VCODE=$((31000 + $(git rev-list --count HEAD)))
            SHA=$(git rev-parse --short=8 HEAD)
            echo "tag_name=v${VCODE}-${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          generate_release_notes: true
          # 只上传 aarch64 的 xudc / ksuinit。
          # 此前同时列出 x86_64 目录，而两个目录里的文件名都是 xudc / ksuinit，
          # action-gh-release 上传第二个同名文件时要去 PATCH 已存在 asset 的元数据，
          # 拿到 404 后抛错：job 失败、Release 停在 draft 状态，公开 API 读不到，
          # 管理器的检查更新因此完全无感。Android 设备是 arm64，保留 aarch64 即可。
          files: |
            artifacts/manager/*.apk
            artifacts/ksud-aarch64/*
            artifacts/ksuinit-aarch64/*
            artifacts/ko/*
            artifacts/external-modules/*.zip
