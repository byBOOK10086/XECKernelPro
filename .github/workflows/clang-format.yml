name: ClangFormat check

on:
  push:
    branches:
      - 'main'
      - 'dev'
    paths:
      - '.github/workflows/clang-format.yml'
      - 'kernel/**/*.c'
      - 'kernel/**/*.h'
  pull_request:
    branches:
      - 'main'
      - 'dev'
    paths:
      - '.github/workflows/clang-format.yml'
      - 'kernel/**/*.c'
      - 'kernel/**/*.h'
      - 'kernel/.clang-format'

permissions:
  checks: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: check
        working-directory: kernel
        # 钉版本：runner 预装的 clang-format 会随发行版漂移，与本地
        # `pip install clang-format==23.1.2` 保持一致，避免同码不同判。
        run: |
          pip install clang-format==23.1.2
          make check-format
