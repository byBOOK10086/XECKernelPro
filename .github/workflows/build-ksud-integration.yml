name: Build ksud builtin integration

on:
  push:
    branches:
      - debug/stability-20261102
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: 27.3.13750724

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build builtin engine assets
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bash .github/scripts/build-builtin-modules.sh

      - name: Build arm64 ksud with embedded engines
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup update stable
          rustup target add aarch64-linux-android
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
          cargo build --target "$TRIPLE" --release --manifest-path userspace/ksud/Cargo.toml
          test -s "target/$TRIPLE/release/xudc"
          file "target/$TRIPLE/release/xudc"

      - name: Upload ksud artifact
        uses: actions/upload-artifact@v4
        with:
          name: xudc-arm64-builtin-integration
          path: target/aarch64-linux-android/release/xudc
