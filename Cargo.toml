[workspace]
members = [
    "userspace/ksud",
    "userspace/ksuinit",
]
default-members = [
    "userspace/ksud",
    "userspace/ksuinit",
]
# Vendored third-party crates under third_party/ are built standalone by CI
# (see .github/scripts/build-builtin-modules.sh) and must not join this
# workspace, or cargo refuses to build them ("believes it's in a workspace").
exclude = [
    "third_party/tricky-addon-enhanced/rust",
    "third_party/tricky-addon-enhanced/external/resetprop-rs",
    "third_party/TEESimulator-RS/native-certgen",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
anyhow = "1"
log = "0.4"

[profile.release]
strip = true
lto = true
opt-level = "z"
panic = "abort"

[profile.release.package.xudc]
codegen-units = 1
